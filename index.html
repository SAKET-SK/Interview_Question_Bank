<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Q&A Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">
  <header>
    <p class="kicker">Scenario-based interview prep</p>
    <h1>Question Bank</h1>
    <p class="sub">Every scenario question you've collected, one tab each. Tap a tab to read the answer. Search to jump straight to the one you need.</p>
  </header>

  <div class="search-row">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search by keyword — question, company, or answer text…">
    </div>
    <button class="add-btn" id="openAddBtn">+ Add question</button>
  </div>

  <div class="meta-row">
    <span id="countLabel">0 questions</span>
    <span>tap any tab to open the answer</span>
  </div>

  <div class="board">
    <div class="tabs" id="tabsContainer"></div>
    <div class="empty-state" id="emptyState" style="display:none;">No matches. Try a different keyword.</div>
  </div>
</div>

<!-- Answer Modal -->
<div class="modal-overlay" id="answerOverlay">
  <div class="modal">
    <button class="modal-close" id="closeAnswerModal">✕</button>
    <p class="modal-tag" id="answerCompany"></p>
    <h2 id="answerQuestion"></h2>
    <p class="answer-label">Answer</p>
    <p class="answer-text" id="answerText"></p>
    <div class="modal-footer">
      <button class="delete-link" id="deleteBtn">Remove this question</button>
    </div>
  </div>
</div>

<!-- Add Question Modal -->
<div class="modal-overlay" id="addOverlay">
  <div class="modal">
    <button class="modal-close" id="closeAddModal">✕</button>
    <p class="modal-tag">New entry</p>
    <h2 style="margin-bottom:24px;">Add a question</h2>
    <div class="form-grid">
      <div>
        <label for="newCompany">Company</label>
        <input type="text" id="newCompany" placeholder="e.g. Amazon">
      </div>
      <div>
        <label for="newRole">Role</label>
        <input type="text" id="newRole" placeholder="e.g. Product Manager">
      </div>
      <div>
        <label for="newQuestion">Question</label>
        <textarea id="newQuestion" placeholder="Paste the scenario question…"></textarea>
      </div>
      <div>
        <label for="newAnswer">Answer</label>
        <textarea id="newAnswer" placeholder="Your answer…" style="min-height:150px;"></textarea>
      </div>
      <button class="save-btn" id="saveNewBtn">Save question</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
